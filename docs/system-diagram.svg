<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Hokie Air system diagram</title><desc id="desc">FlightGame coordinates Flight, Aircraft, Options, Dispatcher and FlightOutcome. Arrows identify ownership and decision data flow.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6d5157"/></marker></defs>
<rect width="1200" height="860" fill="#faf8f5"/>
<text x="60" y="60" font-family="Arial,sans-serif" font-size="18" fill="#8b263d" letter-spacing="2">HOKIE AIR / FINAL BUILD</text>
<text x="60" y="107" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#231c22">Six classes. One dispatch decision.</text>
<text x="60" y="140" font-family="Arial,sans-serif" font-size="17" fill="#655a60">Generate a flight → validate the choice → calculate an outcome → update airline state</text>
<path d="M370 310 H445" fill="none" stroke="#6d5157" stroke-width="2" marker-end="url(#arrow)"/>
<text x="378" y="294" font-family="Arial,sans-serif" font-size="14" fill="#6d5157">generates</text>
<path d="M755 310 H830" fill="none" stroke="#6d5157" stroke-width="2" marker-end="url(#arrow)"/>
<text x="763" y="294" font-family="Arial,sans-serif" font-size="14" fill="#6d5157">assigns</text>
<path d="M170 425 V580" fill="none" stroke="#6d5157" stroke-width="2" marker-end="url(#arrow)"/>
<text x="65" y="510" font-family="Arial,sans-serif" font-size="14" fill="#6d5157">validates menu</text>
<path d="M310 425 V495 H940 V580" fill="none" stroke="#6d5157" stroke-width="2" marker-end="url(#arrow)"/>
<text x="615" y="482" font-family="Arial,sans-serif" font-size="14" fill="#6d5157">calculates outcome</text>
<path d="M255 425 V550 H505 V580" fill="none" stroke="#6d5157" stroke-width="2" marker-end="url(#arrow)"/>
<text x="319" y="541" font-family="Arial,sans-serif" font-size="14" fill="#6d5157">updates airline</text>
<path d="M830 685 H755" fill="none" stroke="#6d5157" stroke-width="2" marker-end="url(#arrow)"/>
<text x="772" y="672" font-family="Arial,sans-serif" font-size="14" fill="#6d5157">applies</text>
<rect x="60" y="215" width="310" height="210" rx="12" fill="white" stroke="#d4c9ca"/>
<path d="M72 215 H358 Q370 215 370 227 V267 H60 V227 Q60 215 72 215" fill="#6b1831"/>
<text x="80" y="249" font-family="Arial,sans-serif" font-weight="bold" font-size="23" fill="white">FlightGame</text>
<text x="80" y="297" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Runs ten rounds and console input</text>
<text x="80" y="323" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Remembers generated flights</text>
<text x="80" y="349" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Coordinates decisions and results</text>
<text x="80" y="375" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Random scenarios / optional seed</text>
<text x="80" y="401" font-family="Arial,sans-serif" font-size="16" fill="#332b31">main(), generateFlight(), endGame()</text>
<rect x="445" y="215" width="310" height="210" rx="12" fill="white" stroke="#d4c9ca"/>
<path d="M457 215 H743 Q755 215 755 227 V267 H445 V227 Q445 215 457 215" fill="#6b1831"/>
<text x="465" y="249" font-family="Arial,sans-serif" font-weight="bold" font-size="23" fill="white">Flight</text>
<text x="465" y="297" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Route, weather, passengers, time</text>
<text x="465" y="323" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Status, fuel needed, arrival delay</text>
<text x="465" y="349" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Fuel price (including price spikes)</text>
<text x="465" y="375" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Departure checks and transitions</text>
<text x="465" y="401" font-family="Arial,sans-serif" font-size="16" fill="#332b31">canDispatch(), completeFlight()</text>
<rect x="830" y="215" width="310" height="210" rx="12" fill="white" stroke="#d4c9ca"/>
<path d="M842 215 H1128 Q1140 215 1140 227 V267 H830 V227 Q830 215 842 215" fill="#6b1831"/>
<text x="850" y="249" font-family="Arial,sans-serif" font-weight="bold" font-size="23" fill="white">Aircraft</text>
<text x="850" y="297" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Name and passenger capacity</text>
<text x="850" y="323" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Current fuel and tank capacity</text>
<text x="850" y="349" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Fuel and passenger validation</text>
<text x="850" y="375" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Adds fuel within tank limits</text>
<text x="850" y="401" font-family="Arial,sans-serif" font-size="16" fill="#332b31">hasEnoughFuel(), addFuel()</text>
<rect x="60" y="580" width="310" height="210" rx="12" fill="white" stroke="#d4c9ca"/>
<path d="M72 580 H358 Q370 580 370 592 V632 H60 V592 Q60 580 72 580" fill="#6b1831"/>
<text x="80" y="614" font-family="Arial,sans-serif" font-weight="bold" font-size="23" fill="white">Options</text>
<text x="80" y="662" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Ordered menu choices</text>
<text x="80" y="688" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Dispatch always displayed</text>
<text x="80" y="714" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Add Fuel only when needed</text>
<text x="80" y="740" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Accepts action names or numbers</text>
<text x="80" y="766" font-family="Arial,sans-serif" font-size="16" fill="#332b31">getAvailableOptions(), getChoice()</text>
<rect x="445" y="580" width="310" height="210" rx="12" fill="white" stroke="#d4c9ca"/>
<path d="M457 580 H743 Q755 580 755 592 V632 H445 V592 Q445 580 457 580" fill="#6b1831"/>
<text x="465" y="614" font-family="Arial,sans-serif" font-weight="bold" font-size="23" fill="white">Dispatcher</text>
<text x="465" y="662" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Cash and reputation</text>
<text x="465" y="688" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Resolved-round count</text>
<text x="465" y="714" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Affordability and accounting limits</text>
<text x="465" y="740" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Applies a validated outcome</text>
<text x="465" y="766" font-family="Arial,sans-serif" font-size="16" fill="#332b31">canAfford(), applyOutcome()</text>
<rect x="830" y="580" width="310" height="210" rx="12" fill="white" stroke="#d4c9ca"/>
<path d="M842 580 H1128 Q1140 580 1140 592 V632 H830 V592 Q830 580 842 580" fill="#6b1831"/>
<text x="850" y="614" font-family="Arial,sans-serif" font-weight="bold" font-size="23" fill="white">FlightOutcome</text>
<text x="850" y="662" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Reads the current flight</text>
<text x="850" y="688" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Computes cash and reputation</text>
<text x="850" y="714" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Weather arrival and compensation</text>
<text x="850" y="740" font-family="Arial,sans-serif" font-size="16" fill="#332b31">Feedback plus round-ending flag</text>
<text x="850" y="766" font-family="Arial,sans-serif" font-size="16" fill="#332b31">calculateOutcome()</text>
<text x="60" y="832" font-family="Arial,sans-serif" font-size="14" fill="#655a60">A calculation does not change game state. Rejected input or unaffordable actions leave flight and airline unchanged.</text></svg>